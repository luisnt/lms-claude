[package]
name = "lms-claude"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Luis Caldas <github.com/luisnt>"]
description = "Launch Claude Code against a local LM Studio runtime"
license = "MIT"
repository = "https://github.com/luisnt/lms-claude"
readme = "README.md"
keywords = ["claude", "lm-studio", "local-ai", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lms-claude"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
which = "7.0"
dirs = "5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
